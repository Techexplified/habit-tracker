<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Habit & Streak Tracker Connector</title>
    <!-- Official Trello Power-Up Client Library -->
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <script>
      window.TrelloPowerUp.initialize({
        'show-settings': function (t, options) {
          return t.popup({
            title: 'Habit Tracker Settings',
            url: './settings.html',
            height: 180
          });
        },
        'board-buttons': function (t, options) {
          return [
            {
              icon: {
                dark: window.location.origin + '/icons/flame-dark.svg',
                light: window.location.origin + '/icons/flame-light.svg'
              },
              text: 'Habit Tracker',
              callback: function (tContext) {
                return tContext.modal({
                  title: 'Habit & Streak Tracker',
                  url: window.location.origin + '/index.html',
                  height: 840,
                  fullscreen: false
                });
              }
            }
          ];
        },
        'card-back-section': function (t, options) {
          return {
            title: 'Habit & Streak Tracker',
            icon: window.location.origin + '/icons/flame-dark.svg',
            content: {
              type: 'iframe',
              url: t.signUrl(window.location.origin + '/index.html'),
              height: 860
            }
          };
        },
        'card-buttons': function (t, options) {
          return [
            {
              icon: window.location.origin + '/icons/flame-light.svg',
              text: 'Habit Tracker',
              callback: function (tContext) {
                return tContext.modal({
                  title: 'Habit & Streak Tracker',
                  url: window.location.origin + '/index.html',
                  height: 840,
                  fullscreen: false
                });
              }
            }
          ];
        },
        'card-badges': function (t, options) {
          return t.get('card', 'shared', 'habit_data')
            .then(function (data) {
              if (!data || typeof data.currentStreak !== 'number' || data.currentStreak === 0) {
                return [];
              }
              return [
                {
                  text: '🔥 ' + data.currentStreak + 'd streak',
                  color: data.markedToday ? 'green' : 'blue'
                }
              ];
            })
            .catch(function () {
              return [];
            });
        },
        'card-detail-badges': function (t, options) {
          return t.get('card', 'shared', 'habit_data')
            .then(function (data) {
              if (!data || typeof data.currentStreak !== 'number') {
                return [];
              }
              return [
                {
                  title: 'Habit Streak',
                  text: data.currentStreak + ' days' + (data.markedToday ? ' (Completed)' : ''),
                  color: data.markedToday ? 'green' : 'blue',
                  callback: function (tContext) {
                    return tContext.modal({
                      title: 'Habit & Streak Tracker',
                      url: window.location.origin + '/index.html',
                      height: 840,
                      fullscreen: false
                    });
                  }
                }
              ];
            })
            .catch(function () {
              return [];
            });
        }
      });
    </script>
  </head>
  <body></body>
</html>
