<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Authorize Habit & Streak Tracker</title>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #0f172a;
        text-align: center;
      }
      .logo {
        width: 48px;
        height: 48px;
        margin: 0 auto 12px;
        background: linear-gradient(135deg, #f59e0b, #ea580c);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        box-shadow: 0 4px 10px rgba(234, 88, 12, 0.25);
      }
      h2 {
        margin: 0 0 6px 0;
        font-size: 16px;
        font-weight: 700;
      }
      p {
        margin: 0 0 16px 0;
        color: #64748b;
        font-size: 13px;
        line-height: 1.4;
      }
      .btn {
        display: inline-block;
        width: 100%;
        box-sizing: border-box;
        padding: 10px 16px;
        background: #00875a;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .btn:hover {
        background: #007048;
      }
      .btn:disabled {
        background: #94a3b8;
        cursor: not-allowed;
      }
      .footer {
        margin-top: 12px;
        font-size: 11px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="logo">🔥</div>
    <h2>Authorize Habit Tracker</h2>
    <p>Connect your Trello account to synchronize your habits and streaks across your boards.</p>

    <button id="auth-btn" class="btn">Authorize with Trello</button>

    <div class="footer">Zero-auth card storage is also supported.</div>

    <script>
      var t = window.TrelloPowerUp.iframe();
      var authBtn = document.getElementById('auth-btn');

      // Check if API key is stored in board shared data or query params
      t.get('board', 'shared', 'trello_api_key')
        .then(function(savedApiKey) {
          var urlParams = new URLSearchParams(window.location.search);
          var apiKey = urlParams.get('key') || savedApiKey || '5ee2b9215d8628ad2a7bf89d5f0e13fe'; // fallback demo key

          authBtn.addEventListener('click', function() {
            authBtn.disabled = true;
            authBtn.textContent = 'Opening Trello Authorization...';

            var returnUrl = window.location.origin + '/auth-return.html';
            var authUrl = 'https://trello.com/1/authorize?' +
              'expiration=never' +
              '&name=' + encodeURIComponent('Habit & Streak Tracker') +
              '&scope=read,write' +
              '&response_type=token' +
              '&key=' + encodeURIComponent(apiKey) +
              '&return_url=' + encodeURIComponent(returnUrl);

            t.authorize(authUrl, {
              height: 680,
              width: 580,
              validToken: function(token) {
                return typeof token === 'string' && token.length > 10;
              }
            })
            .then(function(token) {
              return t.set('member', 'private', 'token', token);
            })
            .then(function() {
              return t.closePopup();
            })
            .catch(function(err) {
              console.warn('Auth canceled or failed:', err);
              authBtn.disabled = false;
              authBtn.textContent = 'Authorize with Trello';
            });
          });
        });
    </script>
  </body>
</html>
